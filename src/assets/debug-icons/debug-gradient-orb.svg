<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Debug gradient orb</title>
  <desc id="desc">A white circle over a black-and-white diagonal gradient background with a soft black glow.</desc>
  <defs>
    <linearGradient id="diagonal-gradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#000" />
      <stop offset="1" stop-color="#fff" />
    </linearGradient>
    <filter id="orb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feFlood flood-color="#000" flood-opacity="0.9" />
      <feComposite in2="blur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" fill="url(#diagonal-gradient)" />
  <circle cx="128" cy="128" r="54" fill="#fff" filter="url(#orb-glow)" />
</svg>
